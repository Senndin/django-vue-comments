# Увесь бекенд-стек одним стеком контейнерів (T5).
# Значення для ${...} Compose бере з файлу .env поруч із цим файлом.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Іменований том: дані БД переживають перезбирання контейнера.
      - pgdata:/var/lib/postgresql/data
    ports:
      # Лише для localhost: щоб запускати бекенд і тести з venv проти цієї БД
      # (files/SPEC.md §11.2). Назовні порт не світиться.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # $$ — екранований $, щоб змінну підставив shell усередині контейнера, а не Compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # У мережі Compose хости беруться з імен сервісів; значення з .env перекриваються.
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
    depends_on:
      # Чекаємо не на «контейнер запущено», а на healthcheck: міграції стартують,
      # коли PostgreSQL справді готовий приймати з'єднання.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    # Той самий образ, що й у бекенда, але замість веб-сервера — воркер Celery (T7).
    build: ./backend
    entrypoint: ["celery", "-A", "config", "worker", "-l", "info"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
