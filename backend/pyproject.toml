[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/F — pycodestyle і pyflakes, I — порядок імпортів, UP — сучасний синтаксис,
# B — типові помилки (bugbear), DJ — правила саме для Django.
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
# Асинхронні тести (WebSocket) виконуються без окремої позначки.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
# Міграції генерує Django: довгі рядки й порядок імпортів там — формат автогенерації.
"*/migrations/*" = ["E501", "I001"]
