# Єдина точка входу застосунку: статика SPA, файли користувачів і проксі на Daphne.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Вкладення важить щонайбільше 5 МБ (A12); запас — на решту полів форми.
    # Без цього nginx віддав би 413 ще до того, як запит дійшов би до Django.
    client_max_body_size 6m;

    # Зібраний фронтенд. `try_files ... /index.html` — правило для SPA: будь-яка
    # невідома адреса віддає index.html, а далі маршрут розбирає застосунок.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Файли користувачів і статика Django лежать у спільних томах із бекендом.
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
    }

    location ~ ^/(api|admin|captcha)/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        # Саме цьому заголовку довіряє бекенд, зберігаючи IP автора коментаря (R2, A2).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend;
        # WebSocket живе на HTTP/1.1 і починається з апгрейда з'єднання —
        # без цих трьох рядків браузер отримав би 400 замість WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # З'єднання довгоживуче: типовий таймаут у 60 секунд розривав би його щохвилини.
        proxy_read_timeout 3600s;
    }
}
